name: 每日自动发布 QwenPaw 离线包 (含日志)

on:
  schedule:
    # 北京时间每天凌晨 2:00 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  daily-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取最新镜像
        run: docker pull agentscope/qwenpaw:latest

      - name: 获取上游最新官方日志
        id: get_changelog
        run: |
          # 尝试获取 QwenPaw 官方仓库的最新 Release 日志
          OFFICIAL_REPO="agentscope-ai/qwenpaw"
          CHANGELOG=$(gh api "repos/${OFFICIAL_REPO}/releases/latest" --jq '.body' 2>/dev/null || echo "官方暂未提供最新的 GitHub Release 日志。")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成基于北京时间的日期版本号
        id: version
        run: |
          VERSION="v$(TZ=Asia/Shanghai date +'%Y.%m.%d')"
          echo "今日版本号: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 检查该版本是否已发布
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "已存在版本 $VERSION，跳过发布。"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "新版本 $VERSION，准备发布。"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 导出并压缩镜像为 tar.gz
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker save agentscope/qwenpaw:latest | gzip > qwenpaw-${VERSION}.tar.gz
          echo "已打包为 qwenpaw-${VERSION}.tar.gz"

      - name: 创建 Release 并上传压缩包
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: QwenPaw 每日镜像 ${{ steps.version.outputs.version }}
          body: |
            📅 自动发布基于北京时间 ${{ steps.version.outputs.version }} 的 QwenPaw 离线镜像包。

            加载方式：
            ```bash
            docker load -i qwenpaw- $ {{ steps.version.outputs.version }}.tar.gz
            ```

            ---
            ### 📝 官方更新日志
            ${{ steps.get_changelog.outputs.changelog }}
          files: qwenpaw-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
