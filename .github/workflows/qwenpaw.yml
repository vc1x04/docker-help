name: 智能发布 QwenPaw 离线包（带镜像校验）

on:
  schedule:
    # 北京时间每天凌晨 2:00 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  release-if-new:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取最新镜像
        run: docker pull agentscope/qwenpaw:latest

      - name: 从镜像中提取真实版本号
        id: version
        run: |
          RAW=$(docker run --rm agentscope/qwenpaw:latest pip show qwenpaw 2>/dev/null | awk '/^Version: /{print $2}')
          if [ -z "$RAW" ]; then
            RAW=$(docker run --rm agentscope/qwenpaw:latest python -c "from importlib.metadata import version; print(version('qwenpaw'))" 2>/dev/null)
          fi
          if [ -z "$RAW" ]; then
            echo "错误：无法从镜像中提取版本号。"
            exit 1
          fi
          VERSION="v${RAW#v}"
          echo "检测到上游版本: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 获取上游镜像的 RepoDigest（sha256）
        id: digest
        run: |
          # 获取该镜像的 RepoDigests，取第一个即对应 agentscope/qwenpaw:latest 的上游 digest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' agentscope/qwenpaw:latest)
          echo "上游镜像摘要: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: 检查该版本是否已发布
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "版本 $VERSION 已存在，跳过发布。"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "新版本 $VERSION，准备发布。"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 导出镜像并压缩
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker save agentscope/qwenpaw:latest | gzip > qwenpaw-${VERSION}.tar.gz
          echo "已打包为 qwenpaw-${VERSION}.tar.gz"

      - name: 计算压缩包的 SHA256
        if: steps.check.outputs.exists == 'false'
        id: filesha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(sha256sum qwenpaw-${VERSION}.tar.gz | awk '{print $1}')
          echo "压缩包 SHA256: $SHA"
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: 获取上游更新日志并生成完整说明
        id: changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 尝试多种 tag 格式拉取上游 Release 日志
          BODY=$(gh api "repos/Agentscope/QwenPaw/releases/tags/${VERSION}" --jq '.body' 2>/dev/null || echo "")
          if [ -z "$BODY" ]; then
            NO_V="${VERSION#v}"
            BODY=$(gh api "repos/Agentscope/QwenPaw/releases/tags/${NO_V}" --jq '.body' 2>/dev/null || echo "")
          fi
          if [ -z "$BODY" ]; then
            BODY="暂无官方更新日志，请访问 [QwenPaw 项目主页](https://github.com/Agentscope/QwenPaw)。"
          fi

          DIGEST="${{ steps.digest.outputs.digest }}"
          FILESHA="${{ steps.filesha.outputs.sha256 }}"
          cat > /tmp/release_body.md <<EOF
          $BODY

          ---

          ## 🔐 校验信息
          本离线包与 **Docker Hub 官方镜像完全一致**，请通过以下信息验证：

          | 类型 | 值 |
          |------|----|
          | 上游镜像摘要 | \`${DIGEST}\` |
          | 压缩包 SHA256 | \`${FILESHA}\` |

          ### 如何验证镜像与上游一致？
          1. 下载压缩包并校验文件完整性：
             \`\`\`bash
             wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/qwenpaw-${VERSION}.tar.gz
             echo "${FILESHA}  qwenpaw-${VERSION}.tar.gz" | sha256sum -c
             \``\`
          2. 加载镜像并查看其 RepoDigest：
             \`\`\`bash
             docker load -i qwenpaw-${VERSION}.tar.gz
             docker images --digests | grep agentscope/qwenpaw
             \`\`\`
          3. 确认输出的摘要中包含 \`${DIGEST#*@}\` 即可证明镜像与上游完全相同。

          ### 基础使用
          \`\`\`bash
          docker pull agentscope/qwenpaw:latest
          # 或加载离线包后直接运行
          docker run -d --name qwenpaw -p 8080:8080 agentscope/qwenpaw:latest
          \`\`\`
          EOF

          echo "changelog_file=/tmp/release_body.md" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 创建 Release 并上传压缩包
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: QwenPaw ${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          files: qwenpaw-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
