name: 检查Docker镜像latest更新并自动发布

on:
  schedule:
    # 每天 UTC 18:00 (北京时间凌晨 2:00) 执行
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 latest 镜像的 Digest (指纹)
        id: get_digest
        run: |
          DOCKER_IMAGE="agentscope/qwenpaw"
          echo "正在获取 $DOCKER_IMAGE:latest 的真实指纹..."
          
          # 调用 Docker Hub API 获取 latest 标签对应的真实镜像 Digest
          DIGEST=$(curl -s "https://hub.docker.com/v2/repositories/${DOCKER_IMAGE}/tags/latest" | jq -r '.images[0].digest')
          
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "错误：未能获取到 latest 镜像的 Digest。"
            exit 1
          fi
          
          # 提取 Digest 的前 12 位作为唯一标识（例如 sha256:abc123... -> abc123456789）
          SHORT_DIGEST=$(echo $DIGEST | cut -c8-19)
          echo "latest 镜像指纹: $SHORT_DIGEST"
          
          # 将完整指纹和短指纹保存为输出变量
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "short_digest=$SHORT_DIGEST" >> $GITHUB_OUTPUT

      - name: 生成基于日期的版本号
        id: generate_version
        run: |
          # 使用当天的日期作为版本号 (格式: v2026.05.21)
          VERSION="v$(date +'%Y.%m.%d')"
          echo "今日生成的版本号: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 检查今日版本是否已发布
        id: check_release
        run: |
          VERSION="${{ steps.generate_version.outputs.version }}"
          echo "检查 Release '${VERSION}' 是否已存在..."
          
          if gh release view "${VERSION}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "今日版本 '${VERSION}' 已存在，跳过创建。"
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "今日版本 '${VERSION}' 不存在，准备创建。"
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 创建新的 Release
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_version.outputs.version }}
          name: QwenPaw 每日更新 ${{ steps.generate_version.outputs.version }}
          body: |
            自动发布的 QwenPaw 每日稳定版 (latest) 更新。
            
            **上游镜像信息：**
            - 镜像名称：`agentscope/qwenpaw:latest`
            - 镜像 Digest：`${{ steps.get_digest.outputs.digest }}`
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
