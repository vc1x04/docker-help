name: 智能发布 QwenPaw 离线包（优化日志拉取）

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  release-if-new:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取最新镜像
        run: docker pull agentscope/qwenpaw:latest

      - name: 从镜像中提取真实版本号
        id: version
        run: |
          RAW=$(docker run --rm agentscope/qwenpaw:latest pip show qwenpaw 2>/dev/null | awk '/^Version: /{print $2}')
          if [ -z "$RAW" ]; then
            RAW=$(docker run --rm agentscope/qwenpaw:latest python -c "from importlib.metadata import version; print(version('qwenpaw'))" 2>/dev/null)
          fi
          if [ -z "$RAW" ]; then
            echo "错误：无法从镜像中提取版本号。"
            exit 1
          fi
          VERSION="v${RAW#v}"
          echo "检测到镜像版本: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 获取上游镜像的 RepoDigest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' agentscope/qwenpaw:latest)
          echo "上游镜像摘要: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: 检查该版本是否已发布
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "版本 $VERSION 已存在，跳过发布。"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "新版本 $VERSION，准备发布。"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 导出镜像（不压缩）
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker save -o qwenpaw-${VERSION}.tar agentscope/qwenpaw:latest
          echo "已导出为 qwenpaw-${VERSION}.tar"

      - name: 计算 tar 文件的 SHA256
        if: steps.check.outputs.exists == 'false'
        id: filesha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(sha256sum qwenpaw-${VERSION}.tar | awk '{print $1}')
          echo "文件 SHA256: $SHA"
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: 获取上游官方最新日志
        id: get_changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          OFFICIAL_REPO="agentscope-ai/QwenPaw"  # 已修正为正确的官方仓库
          VERSION="${{ steps.version.outputs.version }}" # 例如 v1.1.8.post1

          echo "正在从仓库 ${OFFICIAL_REPO} 拉取版本 ${VERSION} 的Release日志..."

          # 直接请求特定版本的Release信息
          RELEASE_BODY=$(gh api "repos/${OFFICIAL_REPO}/releases/tags/${VERSION}" --jq '.body' 2>/dev/null)

          if [ -n "$RELEASE_BODY" ]; then
            echo "成功拉取到版本 ${VERSION} 的官方日志。"
            echo "$RELEASE_BODY" > /tmp/official_changelog.md
            echo "changelog_source=特定版本 (${VERSION})" >> $GITHUB_OUTPUT
          else
            echo "警告：未找到版本 ${VERSION} 的Release日志，尝试拉取最新Release作为备选..."
            # 备选方案：拉取最新Release信息
            LATEST_RELEASE=$(gh api "repos/${OFFICIAL_REPO}/releases/latest" --jq '{tag: .tag_name, body: .body}' 2>/dev/null)
            if [ -n "$LATEST_RELEASE" ]; then
              LATEST_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag')
              LATEST_BODY=$(echo "$LATEST_RELEASE" | jq -r '.body')
              echo "> ⚠️ 注意：当前镜像版本为 ${VERSION}，但以下日志来自官方最新Release（${LATEST_TAG}），可能略有差异。" > /tmp/official_changelog.md
              echo "" >> /tmp/official_changelog.md
              echo "$LATEST_BODY" >> /tmp/official_changelog.md
              echo "changelog_source=最新Release (${LATEST_TAG})" >> $GITHUB_OUTPUT
            else
              echo "错误：无法获取任何官方Release日志。"
              echo "暂无官方更新日志。请访问 [QwenPaw 项目主页](https://github.com/${OFFICIAL_REPO}) 查看。" > /tmp/official_changelog.md
              echo "changelog_source=无" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 生成最终的 Release 说明
        if: steps.check.outputs.exists == 'false'
        id: generate_body
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIGEST="${{ steps.digest.outputs.digest }}"
          FILESHA="${{ steps.filesha.outputs.sha256 }}"
          CHANGELOG_SOURCE="${{ steps.get_changelog.outputs.changelog_source }}"

          echo "## 📋 官方更新日志 (来源: ${CHANGELOG_SOURCE})" > /tmp/release_body.md
          if [ -f /tmp/official_changelog.md ]; then
            cat /tmp/official_changelog.md >> /tmp/release_body.md
          else
            echo "暂无官方更新日志。" >> /tmp/release_body.md
          fi

          cat >> /tmp/release_body.md <<EOF

          ---

          ## 🔐 校验信息
          本离线包与 **Docker Hub 官方镜像完全一致**，请通过以下信息验证：

          | 类型 | 值 |
          |------|----|
          | 上游镜像摘要 | \`${DIGEST}\` |
          | tar 文件 SHA256 | \`${FILESHA}\` |

          ### 验证步骤
          1. 下载并校验文件完整性：
             \`\`\`bash
             wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/qwenpaw-${VERSION}.tar
             echo "${FILESHA}  qwenpaw-${VERSION}.tar" | sha256sum -c
             \`\`\`
          2. 加载镜像并查看 RepoDigest：
             \`\`\`bash
             docker load -i qwenpaw-${VERSION}.tar
             docker images --digests | grep agentscope/qwenpaw
             \`\`\`
          3. 确认输出的摘要中包含 \`${DIGEST#*@}\` 即为官方原版。

          ### 基础使用
          \`\`\`bash
          docker run -d --name qwenpaw -p 8080:8080 agentscope/qwenpaw:latest
          \`\`\`
          EOF

          echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - name: 创建 Release 并上传 tar 文件
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: QwenPaw ${{ steps.version.outputs.version }}
          body_path: ${{ steps.generate_body.outputs.body_file }}
          files: qwenpaw-${{ steps.version.outputs.version }}.tar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
