name: 智能发布 QwenPaw 离线包（带官方日志和校验）

on:
  schedule:
    # 北京时间每天凌晨 2:00 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  release-if-new:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取最新镜像
        run: docker pull agentscope/qwenpaw:latest

      - name: 从镜像中提取真实版本号
        id: version
        run: |
          RAW=$(docker run --rm agentscope/qwenpaw:latest pip show qwenpaw 2>/dev/null | awk '/^Version: /{print $2}')
          if [ -z "$RAW" ]; then
            RAW=$(docker run --rm agentscope/qwenpaw:latest python -c "from importlib.metadata import version; print(version('qwenpaw'))" 2>/dev/null)
          fi
          if [ -z "$RAW" ]; then
            echo "错误：无法从镜像中提取版本号。"
            exit 1
          fi
          VERSION="v${RAW#v}"
          echo "检测到镜像版本: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 获取上游镜像的 RepoDigest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' agentscope/qwenpaw:latest)
          echo "上游镜像摘要: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: 检查该版本是否已发布
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "版本 $VERSION 已存在，跳过发布。"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "新版本 $VERSION，准备发布。"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 导出镜像并压缩
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker save agentscope/qwenpaw:latest | gzip > qwenpaw-${VERSION}.tar.gz
          echo "已打包为 qwenpaw-${VERSION}.tar.gz"

      - name: 计算压缩包的 SHA256
        if: steps.check.outputs.exists == 'false'
        id: filesha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(sha256sum qwenpaw-${VERSION}.tar.gz | awk '{print $1}')
          echo "压缩包 SHA256: $SHA"
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: 获取上游官方最新日志
        id: get_changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          OFFICIAL_REPO="agentscope-ai/qwenpaw"   # 请确认正确的官方仓库
          # 获取最新 Release 的 tag 和 body
          RELEASE_DATA=$(gh api "repos/${OFFICIAL_REPO}/releases/latest" --jq '{tag: .tag_name, body: .body}' 2>/dev/null)
          if [ -z "$RELEASE_DATA" ]; then
            CHANGELOG="官方暂未提供最新的 GitHub Release 日志。"
            RELEASE_TAG="未知"
          else
            RELEASE_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag')
            CHANGELOG=$(echo "$RELEASE_DATA" | jq -r '.body')
          fi
          echo "日志来源版本: $RELEASE_TAG"
          # 将日志内容保存到文件，方便拼接
          echo "$CHANGELOG" > /tmp/official_changelog.md
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 生成最终的 Release 说明
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIGEST="${{ steps.digest.outputs.digest }}"
          FILESHA="${{ steps.filesha.outputs.sha256 }}"
          RELEASE_TAG="${{ steps.get_changelog.outputs.release_tag }}"

          # 写入官方日志（如果来源版本与镜像版本不同，会提示）
          echo "## 📋 官方更新日志" > /tmp/release_body.md
          if [ -f /tmp/official_changelog.md ]; then
            cat /tmp/official_changelog.md >> /tmp/release_body.md
            if [ "$RELEASE_TAG" != "$VERSION" ] && [ "$RELEASE_TAG" != "未知" ]; then
              echo "" >> /tmp/release_body.md
              echo "> ⚠️ 注意：以上日志来自官方最新 Release（${RELEASE_TAG}），与当前镜像版本（${VERSION}）可能略有差异。" >> /tmp/release_body.md
            fi
          else
            echo "暂无官方更新日志。" >> /tmp/release_body.md
          fi

          # 追加校验信息
          cat >> /tmp/release_body.md <<EOF

          ---

          ## 🔐 校验信息
          本离线包与 **Docker Hub 官方镜像完全一致**，请通过以下信息验证：

          | 类型 | 值 |
          |------|----|
          | 上游镜像摘要 | \`${DIGEST}\` |
          | 压缩包 SHA256 | \`${FILESHA}\` |

          ### 验证步骤
          1. 下载压缩包并校验文件完整性：
             \`\`\`bash
             wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/qwenpaw-${VERSION}.tar.gz
             echo "${FILESHA}  qwenpaw-${VERSION}.tar.gz" | sha256sum -c
             \`\`\`
          2. 加载镜像并查看 RepoDigest：
             \`\`\`bash
             docker load -i qwenpaw-${VERSION}.tar.gz
             docker images --digests | grep agentscope/qwenpaw
             \`\`\`
          3. 确认输出的摘要中包含 \`${DIGEST#*@}\` 即为官方原版。

          ### 基础使用
          \`\`\`bash
          docker run -d --name qwenpaw -p 8080:8080 agentscope/qwenpaw:latest
          \`\`\`
          EOF

          echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - name: 创建 Release 并上传压缩包
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: QwenPaw ${{ steps.version.outputs.version }}
          body_path: ${{ steps.generate_final_body.outputs.body_file }}
          files: qwenpaw-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
