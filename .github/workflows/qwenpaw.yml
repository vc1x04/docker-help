name: 智能发布 QwenPaw 离线包（压缩版）

on:
  schedule:
    # 北京时间每天凌晨 2:00 (UTC 18:00)
    - cron: '5 18 * * *'
  workflow_dispatch:

jobs:
  release-if-new:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取最新镜像
        run: docker pull agentscope/qwenpaw:latest

      - name: 从镜像中提取真实版本号
        id: version
        run: |
          RAW=$(docker run --rm agentscope/qwenpaw:latest pip show qwenpaw 2>/dev/null | awk '/^Version: /{print $2}')
          if [ -z "$RAW" ]; then
            RAW=$(docker run --rm agentscope/qwenpaw:latest python -c "from importlib.metadata import version; print(version('qwenpaw'))" 2>/dev/null)
          fi
          if [ -z "$RAW" ]; then
            echo "错误：无法从镜像中提取版本号。"
            exit 1
          fi
          VERSION="v${RAW#v}"
          echo "检测到镜像版本: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 获取上游镜像的 RepoDigest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' agentscope/qwenpaw:latest)
          echo "上游镜像摘要: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: 检查该版本是否已发布
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "版本 $VERSION 已存在，跳过发布。"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "新版本 $VERSION，准备发布。"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 导出镜像并压缩（避免超过 2 GB 限制）
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 使用 pigz 并行压缩，速度快，生成 .tar.gz
          docker save agentscope/qwenpaw:latest | pigz > qwenpaw-${VERSION}.tar.gz
          echo "已压缩打包为 qwenpaw-${VERSION}.tar.gz"

      - name: 计算压缩包的 SHA256
        if: steps.check.outputs.exists == 'false'
        id: filesha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(sha256sum qwenpaw-${VERSION}.tar.gz | awk '{print $1}')
          echo "压缩包 SHA256: $SHA"
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: 获取上游官方对应版本的日志
        id: get_changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          OFFICIAL_REPO="agentscope-ai/QwenPaw"  # 确认为正确的官方仓库
          VERSION="${{ steps.version.outputs.version }}"  # 例如 v1.1.8.post1

          echo "正在拉取版本 ${VERSION} 的官方 Release 日志..."
          RELEASE_BODY=$(gh api "repos/${OFFICIAL_REPO}/releases/tags/${VERSION}" --jq '.body' 2>/dev/null)

          if [ -n "$RELEASE_BODY" ]; then
            echo "成功获取 ${VERSION} 的日志。"
            echo "$RELEASE_BODY" > /tmp/official_changelog.md
            echo "log_source=对应版本" >> $GITHUB_OUTPUT
          else
            echo "未找到 ${VERSION} 的 Release，尝试最新 Release..."
            LATEST=$(gh api "repos/${OFFICIAL_REPO}/releases/latest" --jq '{tag: .tag_name, body: .body}' 2>/dev/null)
            if [ -n "$LATEST" ]; then
              TAG=$(echo "$LATEST" | jq -r '.tag')
              BODY=$(echo "$LATEST" | jq -r '.body')
              echo "> ⚠️ 官方没有 ${VERSION} 对应的 Release，以下日志来自最新的 ${TAG}，仅供参考。" > /tmp/official_changelog.md
              echo "" >> /tmp/official_changelog.md
              echo "$BODY" >> /tmp/official_changelog.md
              echo "log_source=最新 Release (${TAG})" >> $GITHUB_OUTPUT
            else
              echo "暂无官方更新日志。"
              echo "暂无官方更新日志。" > /tmp/official_changelog.md
              echo "log_source=无" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 生成最终 Release 说明
        if: steps.check.outputs.exists == 'false'
        id: generate_body
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIGEST="${{ steps.digest.outputs.digest }}"
          FILESHA="${{ steps.filesha.outputs.sha256 }}"

          echo "## 📋 官方更新日志" > /tmp/release_body.md
          if [ -f /tmp/official_changelog.md ]; then
            cat /tmp/official_changelog.md >> /tmp/release_body.md
          else
            echo "暂无官方更新日志。" >> /tmp/release_body.md
          fi

          cat >> /tmp/release_body.md <<EOF

          ---

          ## 🔐 校验信息
          本离线包与 **Docker Hub 官方镜像完全一致**，请通过以下信息验证：

          | 类型 | 值 |
          |------|----|
          | 上游镜像摘要 | \`${DIGEST}\` |
          | 压缩包 SHA256 | \`${FILESHA}\` |

          ### 验证步骤
          1. 下载并校验压缩包完整性：
             \`\`\`bash
             wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/qwenpaw-${VERSION}.tar.gz
             echo "${FILESHA}  qwenpaw-${VERSION}.tar.gz" | sha256sum -c
             \`\`\`
          2. 加载镜像并核对上游摘要：
             \`\`\`bash
             docker load -i qwenpaw-${VERSION}.tar.gz
             docker images --digests | grep agentscope/qwenpaw
             \`\`\`
          3. 确认输出的摘要中包含 \`${DIGEST#*@}\` 即为官方原版。

          ### 基础使用
          \`\`\`bash
          docker run -d --name qwenpaw -p 8080:8080 agentscope/qwenpaw:latest
          \`\`\`
          EOF

          echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - name: 创建 Release 并上传压缩包
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: QwenPaw ${{ steps.version.outputs.version }}
          body_path: ${{ steps.generate_body.outputs.body_file }}
          files: qwenpaw-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
