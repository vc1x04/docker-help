name: Download AdGuard Home Image

on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * *'  # UTC 00:10 每日触发

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 👇 ====== 仅需修改以下两行即可适配新镜像 ======
      DOCKER_IMAGE: "adguard/adguardhome"       # Docker Hub 镜像全名
      UPSTREAM_REPO: "AdguardTeam/AdGuardHome"  # 对应的 GitHub 仓库 (owner/repo)
      # 👆 ==========================================

    steps:
      # 1. 版本比对 + 上游更新日志（只有 404 才算“未发布”，并预检镜像是否已上架）
      - name: 检查新版本并获取更新日志
        id: check_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESP=$(curl -s -H "Authorization: token ${{ github.token }}" "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest")
          LATEST=$(echo "$RESP" | jq -r '.tag_name // empty' | sed 's/^v//')
          [ -n "$LATEST" ] || { echo "❌ 无法获取上游版本号（API 可能被限流）"; exit 1; }

          TAG="v${LATEST}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")

          # 具体状态必须区分清楚：200=已发布，404=未发布，其它（403 限流 / 5xx）=状态未知
          if [ "$HTTP_CODE" = "200" ]; then
            OWNER=$(gh release view "$TAG" --repo "${{ github.repository }}" --json name --jq '.name' 2>/dev/null || echo "")
            if [[ "$OWNER" == "$DOCKER_IMAGE "* ]]; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "✅ Version ${LATEST} already exists, skipping."
              exit 0
            fi
            # 标签被其它镜像占用：不改名、不覆盖，只告警，留给人工处理
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "::warning::标签 ${TAG} 已被其它镜像占用（${OWNER}），本镜像 ${LATEST} 未同步，需人工处理。"
            exit 0
          elif [ "$HTTP_CODE" != "404" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 仓库接口返回 ${HTTP_CODE}（限流或异常），本次跳过，等待下次运行。"
            exit 0
          fi

          # 镜像就绪预检：上游刚发版 / 镜像还没上架 / 缺 amd64 时，直接 pull 会失败，这里改为安全跳过
          if docker buildx imagetools inspect "${DOCKER_IMAGE}:v${LATEST}" > "${RUNNER_TEMP}/img_inspect.txt" 2>/dev/null; then
            if grep -q "Platform:" "${RUNNER_TEMP}/img_inspect.txt" && ! grep -q "linux/amd64" "${RUNNER_TEMP}/img_inspect.txt"; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "⏭️ 镜像 ${DOCKER_IMAGE}:v${LATEST} 无 linux/amd64 架构，跳过本次，等待下次运行。"
              exit 0
            fi
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 镜像 ${DOCKER_IMAGE}:v${LATEST} 尚未上架（tag 不存在），跳过本次，等待下次运行。"
            exit 0
          fi

          echo "has_new=true" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"

          UPSTREAM_BODY=$(echo "$RESP" | jq -r '.body')
          [ "$UPSTREAM_BODY" = "null" ] && UPSTREAM_BODY="*No release notes provided by upstream.*"

          # 安全写入：静态模板用单引号 Heredoc 避免 YAML/Shell 误解析
          cat > release-body.md <<-'TEMPLATE_EOF'
          ## 📦 Docker Image Mirror
          TEMPLATE_EOF

          {
            echo "- **Version**: \`${LATEST}\`"
            echo "- **Image**: \`${DOCKER_IMAGE}:v${LATEST}\`"
            echo "- **Source**: [Upstream Release](https://github.com/${UPSTREAM_REPO}/releases/tag/v${LATEST})"
            echo ""
            echo "---"
            echo ""
            echo "${UPSTREAM_BODY}"
          } >> release-body.md

          echo "🆕 New version found: ${LATEST}, changelog fetched."

      # ⬇️ 2. 仅在有新版时拉取并导出镜像
      - name: 拉取并导出 Docker 镜像
        if: steps.check_version.outputs.has_new == 'true'
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          # [修复] Docker Hub 镜像 tag 保留 v 前缀（与上游 release tag 一致）
          # 如 adguard/adguardhome:v0.107.79，避免 manifest unknown
          DOCKER_TAG="v${VERSION}"
          docker pull "${DOCKER_IMAGE}:${DOCKER_TAG}"
          docker save "${DOCKER_IMAGE}:${DOCKER_TAG}" > "${DOCKER_IMAGE##*/}-${VERSION}.tar"

      # 🚀 3. 创建 Release 并上传附件
      - name: 创建 Release 并上传附件
        if: steps.check_version.outputs.has_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: "${{ env.DOCKER_IMAGE }} ${{ steps.check_version.outputs.version }}"
          body_path: release-body.md
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: "false"
          draft: false
          prerelease: false
          files: |
            *.tar

      # 📋 4. 触发 index 更新（重建 README 发布索引表）
      - name: 触发索引更新
        if: steps.check_version.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "update-index.yml" --repo "${{ github.repository }}"
