name: Auto Release QwenPaw on Version Change

on:
  schedule:
    - cron: '0 18 * * *'   # 北京时间每天凌晨2点
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE: "agentscope/qwenpaw:latest"
  PROJ_NAME: "QwenPaw"
  FILE_PREFIX: "qwenpaw"
  VERSION_LABEL: ""        # 仍禁用 Label，使用命令提取

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest image
        run: docker pull $IMAGE

      - name: Extract version
        id: version
        run: |
          # 获取 __version__，可能为 "1.1.8" 或 "v1.1.8"
          RAW_VERSION=$(docker run --rm $IMAGE python -c "import qwenpaw; print(qwenpaw.__version__)" 2>/dev/null)
          # 去掉可能的前导 v，再统一加上 v，例如 v1.1.8
          VERSION="v${RAW_VERSION#v}"
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if this version already released
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --json tagName &>/dev/null; then
            echo "Version ${VERSION} already has a release. No release needed."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "New version ${VERSION} detected. Will create release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save and compress Docker image
        if: steps.check.outputs.exists == 'false'
        run: |
          docker save $IMAGE | gzip > $FILE_PREFIX-${{ steps.version.outputs.version }}.tar.gz

      - name: Create Release and Upload Asset
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ env.PROJ_NAME }} ${{ steps.version.outputs.version }}
          files: ${{ env.FILE_PREFIX }}-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
