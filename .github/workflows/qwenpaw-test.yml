name: Download qwenpaw-test Image

on:
  workflow_dispatch:
    inputs:
      # 强制重新同步：忽略 digest 判断，用于调试/重跑
      force:
        description: '强制重新同步（忽略 digest 判断）'
        required: false
        default: false
        type: boolean
  # schedule:  # 测试用，暂不启用定时触发，避免与正式 qwenpaw.yml 冲突
  #   - cron: '0 0 * * *'  # UTC 00:00 每日触发

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ====== 需修改的配置 ======
      DOCKER_IMAGE: "agentscope/qwenpaw"          # Docker Hub 镜像全名
      UPSTREAM_REPO: "agentscope-ai/QwenPaw"      # GitHub 仓库 (仅 release 模式使用；latest 模式可为空)
      # 同步模式：
      #   release = 按 GitHub Release Tag 拉取对应版本镜像（需 UPSTREAM_REPO）
      #   latest  = 拉取 :latest 滚动 tag，先从镜像内部提取版本号
      #      并用 manifest digest 轻量预判，digest 未变则跳过拉取
      SYNC_MODE: "latest"
      # 镜像内 Python 包名（用于提取版本号，可按镜像修改）
      PYPI_PACKAGE: "qwenpaw"
      # 状态文件（记录上次 latest digest）。留空则由 DOCKER_IMAGE 自动推导，不用手动改
      STATE_FILE: ""
      # =========================

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      # 🔍 1. 检测版本（按 SYNC_MODE 自动分流 + 统一已发布检查）
      - name: 检测版本
        id: check_version
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          # [修复-4] 状态文件自动推导：默认 .github/workflows/<镜像名>-<workflow>-latest.digest
          # 加入 workflow 名净化后缀，避免多个 workflow 同步同一镜像时共用/互相覆盖状态文件
          WF_NAME="${{ github.workflow }}"
          WF_SUFFIX=$(echo "$WF_NAME" | tr -cs '[:alnum:]' '_' | tr '[:upper:]' '[:lower:]')
          STATE_FILE="${STATE_FILE:-.github/workflows/${DOCKER_IMAGE##*/}-${WF_SUFFIX}-latest.digest}"
          echo "state_file=${STATE_FILE}" >> "$GITHUB_OUTPUT"

          # [修复-2] 统一：检查目标 tag 是否已发布（两种模式共用）
          check_published() {
            local tag="v$1"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/${tag}")
            [ "$code" = "200" ]
          }

          if [ "$SYNC_MODE" = "release" ]; then
            # —— Release Tag 模式：从 GitHub 最新 Release 获取版本号（轻量，仅 API）——
            LATEST=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" |
              jq -r '.tag_name' |
              sed 's/^v//')
            [ -n "$LATEST" ] && [ "$LATEST" != "null" ] || { echo "❌ 无法获取上游版本号"; exit 1; }
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
            echo "pull_tag=${LATEST}" >> "$GITHUB_OUTPUT"
            echo "already_pulled=false" >> "$GITHUB_OUTPUT"
            if check_published "$LATEST"; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "✅ 版本 v${LATEST} 已发布，跳过。"
            else
              echo "has_new=true" >> "$GITHUB_OUTPUT"
              echo "🆕 Release 模式，新版本: ${LATEST}"
            fi
          elif [ "$SYNC_MODE" = "latest" ]; then
            # —— Rolling Latest 模式：manifest digest 轻量预判，避免每天拉大镜像 ——
            UP_DIGEST=$(docker buildx imagetools inspect "${DOCKER_IMAGE}:latest" --format '{{.Manifest.Digest}}')
            echo "上游 manifest digest: ${UP_DIGEST}"
            LAST_DIGEST=""
            [ -f "$STATE_FILE" ] && LAST_DIGEST=$(cat "$STATE_FILE")
            echo "上次 digest: ${LAST_DIGEST:-<无记录>}"
            echo "mode=latest" >> "$GITHUB_OUTPUT"
            echo "digest=${UP_DIGEST}" >> "$GITHUB_OUTPUT"
            if [ "$UP_DIGEST" = "$LAST_DIGEST" ] && [ "${FORCE:-false}" != "true" ]; then
              echo "digest 未变化，跳过拉取。"
              echo "has_new=false" >> "$GITHUB_OUTPUT"
            else
              echo "digest 已变化或已强制触发，拉取镜像并提取版本号。"
              docker pull "${DOCKER_IMAGE}:latest"
              # [修复-5] 版本提取命令改为可配置的 PYPI_PACKAGE，换镜像不用改代码
              RAW=$(docker run --rm "${DOCKER_IMAGE}:latest" pip show "${PYPI_PACKAGE}" 2>/dev/null | awk '/^Version: /{print $2}')
              if [ -z "$RAW" ]; then
                RAW=$(docker run --rm "${DOCKER_IMAGE}:latest" python -c "from importlib.metadata import version; print(version('${PYPI_PACKAGE}'))" 2>/dev/null)
              fi
              [ -n "$RAW" ] || { echo "❌ 无法从镜像中提取版本号"; exit 1; }
              VERSION="${RAW#v}"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "pull_tag=latest" >> "$GITHUB_OUTPUT"
              # [修复-1] 标记镜像已在 Step 1 拉取，Step 4 不再重复 pull
              echo "already_pulled=true" >> "$GITHUB_OUTPUT"
              if check_published "$VERSION"; then
                echo "has_new=false" >> "$GITHUB_OUTPUT"
                echo "✅ 版本 v${VERSION} 已发布，跳过。"
              else
                echo "has_new=true" >> "$GITHUB_OUTPUT"
                echo "🆕 Latest 模式，新版本: ${VERSION}"
              fi
            fi
          else
            echo "❌ 未知 SYNC_MODE: ${SYNC_MODE}（可选 release / latest）"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # workflow_dispatch 有 default:false；schedule 触发时 inputs 为空，
          # 用 || 'false' 兜底，保证两种触发下 FORCE 恒为 false 或 true
          FORCE: ${{ inputs.force || 'false' }}

      # 📝 2. 组装 Release 说明（changelog 按模式取值）
      - name: 组装 Release 说明
        if: steps.check_version.outputs.has_new == 'true'
        run: |
          if [ "${{ steps.check_version.outputs.mode }}" = "release" ]; then
            UPSTREAM_BODY=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" |
              jq -r '.body')
            [ "$UPSTREAM_BODY" = "null" ] && UPSTREAM_BODY="*No release notes provided by upstream.*"
            DIGEST_LINE=""
          else
            UPSTREAM_BODY="*Rolling latest 镜像，无固定版本 Release 说明。*"
            # latest 模式写入 manifest digest，便于追溯具体镜像版本
            DIGEST_LINE="- **Digest**: \`${{ steps.check_version.outputs.digest }}\`"
          fi

          # [修复-6] Source 链接保护：latest 模式 UPSTREAM_REPO 为空时输出占位说明
          if [ -n "${UPSTREAM_REPO}" ]; then
            SOURCE_LINE="- **Source**: [Upstream](https://github.com/${UPSTREAM_REPO})"
          else
            SOURCE_LINE="- **Source**: 未配置 UPSTREAM_REPO，请参考 Docker Hub 官方文档"
          fi

          cat > release-body.md <<-'TEMPLATE_EOF'
          ## 📦 Docker Image Mirror
          TEMPLATE_EOF
          {
            echo "- **Version**: \`v${{ steps.check_version.outputs.version }}\`"
            echo "- **Image**: \`${DOCKER_IMAGE}:${{ steps.check_version.outputs.pull_tag }}\`"
            echo "${SOURCE_LINE}"
            if [ -n "$DIGEST_LINE" ]; then
              echo "${DIGEST_LINE}"
            fi
            echo ""
            echo "---"
            echo ""
            echo "${UPSTREAM_BODY}"
          } >> release-body.md

      # ⬇️ 3. 导出 Docker 镜像（latest 模式 Step 1 已拉取，仅 release 模式需拉取）
      - name: 导出 Docker 镜像
        if: steps.check_version.outputs.has_new == 'true'
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          PULL_TAG="${{ steps.check_version.outputs.pull_tag }}"
          if [ "${{ steps.check_version.outputs.already_pulled }}" != "true" ]; then
            echo "拉取镜像 ${DOCKER_IMAGE}:${PULL_TAG}"
            docker pull "${DOCKER_IMAGE}:${PULL_TAG}"
          else
            echo "镜像已在 Step 1 拉取，跳过重复 pull。"
          fi
          docker save "${DOCKER_IMAGE}:${PULL_TAG}" | gzip > "${DOCKER_IMAGE##*/}-${VERSION}.tar.gz"

      # 🚀 4. 创建 Release 并上传附件（复用）
      - name: 创建 Release 并上传附件
        if: steps.check_version.outputs.has_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: "${{ env.DOCKER_IMAGE }} ${{ steps.check_version.outputs.version }}"
          body_path: release-body.md
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: "false"
          draft: false
          prerelease: false
          files: |
            *.tar.gz

      # 📋 5. 更新 latest digest 状态文件（仅 latest 模式且 digest 变化时）
      - name: 更新 latest digest 状态
        if: steps.check_version.outputs.has_new == 'true' && steps.check_version.outputs.mode == 'latest'
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          STATE_FILE="${{ steps.check_version.outputs.state_file }}"
          UP_DIGEST="${{ steps.check_version.outputs.digest }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # [修复-3] 修复 detached HEAD 与并发冲突隐患：
          # 状态文件每次全量覆盖、无需保留旧提交，直接以远端为基准重建本地分支，
          # 避免原 rebase 命令失败被 `|| true` 吞掉后留下冲突/中断态
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"

          echo "$UP_DIGEST" > "$STATE_FILE"

          git add "$STATE_FILE"
          if git diff --cached --quiet; then
            echo "状态文件无变更，跳过提交。"
          else
            git commit -m "chore: update ${DOCKER_IMAGE} latest digest"
            # push 失败重试：并发下可能 non-fast-forward，先重新 fetch 再重试，最多 3 次
            RETRY=0
            while [ "$RETRY" -lt 3 ]; do
              if git push origin "${BRANCH}"; then
                echo "✅ 推送成功。"
                break
              fi
              RETRY=$((RETRY + 1))
              echo "⚠️ 第 ${RETRY} 次推送失败，重新 fetch 远端后重试..."
              # 重置到远端最新，重新写入状态文件再提交，保证 digest 更新不丢失
              git fetch origin "${BRANCH}"
              git checkout -B "${BRANCH}" "origin/${BRANCH}"
              echo "$UP_DIGEST" > "$STATE_FILE"
              git add "$STATE_FILE"
              # 远端可能已被其他 run 写入相同 digest，重试前先判断有无变更，
              # 避免 git commit 因 "nothing to commit" 返回非零退出码
              if git diff --cached --quiet; then
                # 远端已是最新，digest 已同步到位，目标达成，直接结束，避免多余 push
                echo "远端已是最新，digest 已同步，无需再 push。"
                break
              else
                git commit -m "chore: update ${DOCKER_IMAGE} latest digest (retry)"
              fi
            done
            # 重试耗尽仍失败则显式报错，避免静默丢失 digest 更新
            if [ "$RETRY" -ge 3 ]; then
              echo "❌ 推送连续失败 3 次。"
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}