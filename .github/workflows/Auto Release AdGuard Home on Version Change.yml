name: Auto Release AdGuard Home on Version Change

on:
  schedule:
    - cron: '0 18 * * *'   # 北京时间每天凌晨2点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest AdGuard Home image
        run: docker pull adguard/adguardhome:latest

      - name: Extract upstream version
        id: version
        run: |
          VERSION=$(docker run --rm adguard/adguardhome:latest --version | awk '{print $NF}')
          echo "Detected upstream version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if this version already released
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 直接用 gh release view 检查 Tag 是否存在（不存在会返回非零）
          if gh release view "$VERSION" --json tagName &>/dev/null; then
            echo "Version ${VERSION} already has a release. No release needed."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "New version ${VERSION} detected. Will create release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Docker image
        if: steps.check.outputs.exists == 'false'
        run: |
          docker save -o adguardhome-${{ steps.version.outputs.version }}.tar \
            adguard/adguardhome:latest

      - name: Create Release and Upload Asset
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AdGuard Home ${{ steps.version.outputs.version }}
          files: adguardhome-${{ steps.version.outputs.version }}.tar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
