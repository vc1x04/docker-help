name: Auto Release AdGuard Home on Version Change

on:
  schedule:
    - cron: '0 18 * * *'   # 北京时间每天凌晨2点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest AdGuard Home image
        run: docker pull adguard/adguardhome:latest

      - name: Extract upstream version
        id: version
        run: |
          VERSION=$(docker run --rm adguard/adguardhome:latest --version | awk '{print $NF}')
          echo "Detected upstream version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if this version already released
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --json tagName &>/dev/null; then
            echo "Version ${VERSION} already has a release. No release needed."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "New version ${VERSION} detected. Will create release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream changelog
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 调用 GitHub API 获取 AdGuardHome 仓库该版本的 Release 信息
          CHANGELOG=$(gh api "repos/AdguardTeam/AdGuardHome/releases/tags/${VERSION}" --jq '.body' 2>/dev/null || echo "")
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No official changelog found for this version. Built from upstream Docker image \`adguard/adguardhome:${VERSION}\`."
          fi
          # 将日志内容写入文件，避免特殊字符在 shell 中解析错误
          echo "$CHANGELOG" > /tmp/changelog.md
          echo "changelog_file=/tmp/changelog.md" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Docker image
        if: steps.check.outputs.exists == 'false'
        run: |
          docker save -o adguardhome-${{ steps.version.outputs.version }}.tar \
            adguard/adguardhome:latest

      - name: Create Release and Upload Asset
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AdGuard Home ${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          files: adguardhome-${{ steps.version.outputs.version }}.tar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
