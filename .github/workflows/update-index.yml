name: Update Release Index

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Index Table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          # 1. 获取数据并保存（沿用已验证可用的原始命令）
          gh release list --limit 100 --json tagName,publishedAt,name \

            | jq -r 'sort_by(.publishedAt) | reverse | .[] | "\(.tagName)|\(.publishedAt)|\(.name)"' \
            > /tm
