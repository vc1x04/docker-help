name: Update Release Index

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

concurrency:
  group: update-release-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild Index Table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          gh release list --limit 100 --json tagName,publishedAt,name \

            | jq -r 'sort_by(.publishedAt) | reverse | .[] | "\(.tagName)|\(.publishedAt)|\(.name)"' \
            > /tmp/releases_raw.txt

          cat > /tmp/rebuild_index.py << 'EOF'
import sys
import os
from datetime import datetime

repo_root = os.environ.get('GITHUB_WORKSPACE', '.')
readme_path = os.path.join(repo_root, 'README.md')

groups = {}
with open('/tmp/releases_raw.txt', 'r') as f:
    for line in f:
        line = line.strip()
        if not line or '|' not in line:
            continue
        parts = line.split('|', 2)
        if len(parts) != 3:
            continue
        tag, date_str, name = parts
        # 防御性处理：name 为 null 时回退使用 tag
        name = name or tag
        image = name.rsplit(' ', 1)[0].strip() if ' ' in name else name.strip()
        version = tag.lstrip('v')
        try:
            date_fmt = datetime.fromisoformat(date_str.replace('Z', '+00:00')).strftime('%Y-%m-%d')
        except Exception:
            date_fmt = date_str[:10]
        link = f"[View](../../releases/tag/{tag})"
        groups.setdefault(image, []).append((version, date_fmt, link))

sorted_groups = sorted(groups.items(), key=lambda x: x[0].lower())
for img, entries in sorted_groups:
    entries.sort(key=lambda x: x[1], reverse=True)

lines = [
    "| 镜像 | 最新版本 | 更新时间 | Release |",
    "|------|---------|---------|--------|"
]
for img, entries in sorted_groups:
    for ver, date, link in entries:
        lines.append(f"| {img} | {ver} | {date} | {link} |")

table_md = '\n'.join(lines) + '\n'

content = open(readme_path, 'r').read()
start = '<!-- AUTO-INDEX-START -->'
end = '<!-- AUTO-INDEX-END -->'
if start not in content or end not in content:
    print(f'Error: Missing anchor comments in {readme_path}', file=sys.stderr)
    print('Please ensure README.md contains both <!-- AUTO-INDEX-START --> and <!-- AUTO-INDEX-END -->', file=sys.stderr)
    sys.exit(1)

result = (
    content[:content.index(start) + len(start)]
    + '\n' + table_md + '\n'
    + content[content.index(end):]
)
open(readme_path, 'w').write(result)
print(f'Successfully updated {readme_path}')
EOF
          python3 /tmp/rebuild_index.py

      - name: Commit and push changes
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update release index table"
            git push
          else
            echo "No changes to commit"
          fi
