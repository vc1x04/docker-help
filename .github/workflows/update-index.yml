name: Update Release Index

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

concurrency:
  group: update-release-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }} # 🔑 修复1: 强制拉取主分支最新代码

          fetch-depth: 1

      - name: Fetch releases and rebuild index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release list --limit 100 --json tagName,publishedAt,name > /tmp/releases_raw.json
          python3 .github/scripts/rebuild_index.py

      - name: Commit and push changes
        run: |
          cd "$GITHUB_WORKSPACE"
          BRANCH="${{ github.event.repository.default_branch }}"
          git checkout -B "$BRANCH" origin/"$BRANCH" 2>/dev/null || git checkout -b "$BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update release index table"
            git push origin "$BRANCH" # 🔑 修复3: 显式指定推送目标分支
          else
            echo "No changes to commit"
          fi
