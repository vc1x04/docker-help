name: Update README Index

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Index Table
        run: |
          set -euo pipefail

          # 获取所有非 draft、非 prerelease 的 Release，按发布时间倒序
          RELEASES=$(gh release list --limit 100 --json tagName,publishedAt,name \

            | jq -r 'sort_by(.publishedAt) | reverse | .[] | "\(.tagName)|\(.publishedAt)|\(.name)"')

          # 生成表格内容
          TABLE="| 镜像 | 最新版本 | 更新时间 | Release |\n"
          TABLE+="|------|---------|---------|--------|\n"

          while IFS='|' read -r tag date name; do
            # 从 Release name 中提取镜像名（格式: "adguard/adguardhome v0.107.60"）
            IMAGE=$(echo "$name" | sed 's/ [^ ]*$//')
            VERSION=$(echo "$tag" | sed 's/^v//')
            DATE_FMT=$(date -d "$date" '+%Y-%m-%d' 2>/dev/null || echo "$date")
            LINK="[View](../../releases/tag/${tag})"
            TABLE+="| ${IMAGE} | ${VERSION} | ${DATE_FMT} | ${LINK} |\n"
          done <<< "$RELEASES"

          # 用 sed 替换锚点之间的内容
          sed -i "/<!-- AUTO-INDEX-START -->/,/<!-- AUTO-INDEX-END -->/c\\
          <!-- AUTO-INDEX-START -->\n$(echo -e "$TABLE")\n<!-- AUTO-INDEX-END -->" README.md

        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: auto-update release index table"
          git push
