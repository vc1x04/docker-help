name: Update Release Index

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

concurrency:
  group: update-release-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch releases and rebuild index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release list --limit 100 --json tagName,publishedAt,name > /tmp/releases_raw.json
          python3 .github/scripts/rebuild_index.py

      - name: Commit and push changes
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update release index table"
            git push
          else
            echo "No changes to commit"
          fi
