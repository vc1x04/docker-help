name: Download dpanel-lite Image (验证)

# ⚠️ 验证工作流：用于验证「滚动 tag(lite)」场景下模板逻辑是否可用
# 与 dpanel.yml 完全独立，互不干扰，不影响原文件。
# Release 使用 v<version>-lite 作为独立 tag，避免与 dpanel.yml 的 v<version> 冲突。

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'  # UTC 00:00 每日触发

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: "dpanel/dpanel"       # Docker Hub 镜像全名
      UPSTREAM_REPO: "donknap/dpanel"     # 对应的 GitHub 仓库 (owner/repo)
      IMAGE_SHORT: "dpanel"                # 导出文件名用，取镜像名最后一段
      IMAGE_TAG_PREFIX: ""    # 镜像 tag 前缀：Docker Hub 侧带 v 的镜像填 "v"
      TAG_SUFFIX: "-lite"               # Release 标签后缀：lite 变体填 "-lite"
      # 🔍 本次要验证的镜像 tag（lite 滚动 tag）
      IMAGE_TAG: "lite"

    steps:
      # 🔍 0. 镜像 tag digest 探测（验证 lite 与版本 tag 的关系）
      - name: 探测镜像 tag digest
        id: probe
        run: |
          set -euo pipefail
          echo "=== 探测 ${DOCKER_IMAGE} 各 tag 的 digest ==="
          for tag in "${IMAGE_TAG}" latest 1.10.6; do
            dig=$(docker manifest inspect "${DOCKER_IMAGE}:${tag}" 2>/dev/null | jq -r '.config.digest // .manifests[0].digest // "N/A"' 2>/dev/null || echo "N/A")
            echo "  ${tag} -> ${dig}"
          done
          echo "=== 对比: ${IMAGE_TAG} 与 1.10.6 ==="
          DIG_LITE=$(docker manifest inspect "${DOCKER_IMAGE}:${IMAGE_TAG}" 2>/dev/null | jq -r '.config.digest // empty' 2>/dev/null || echo "")
          DIG_VER=$(docker manifest inspect "${DOCKER_IMAGE}:1.10.6" 2>/dev/null | jq -r '.config.digest // empty' 2>/dev/null || echo "")
          if [ -n "$DIG_LITE" ] && [ "$DIG_LITE" = "$DIG_VER" ]; then
            echo "✅ ${IMAGE_TAG} 与 1.10.6 是同一镜像 (digest 一致)"
            echo "same_as_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ ${IMAGE_TAG} 与 1.10.6 不是同一镜像 (digest 不同)"
            echo "same_as_version=false" >> "$GITHUB_OUTPUT"
          fi

      # 1. 版本比对 + 上游更新日志（含限流保护与跨镜像标签防撞）
      - name: 检查新版本并获取更新日志
        id: check_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESP=$(curl -s -H "Authorization: token ${{ github.token }}" "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest")
          LATEST=$(echo "$RESP" | jq -r '.tag_name // empty' | sed 's/^v//')
          [ -n "$LATEST" ] || { echo "❌ 无法获取上游版本号（API 可能被限流）"; exit 1; }

          # Release 标签共用 v<版本><后缀> 命名空间，先按原命名查询：
          #   200 = 已存在（还需确认是否属于本镜像）
          #   404 = 不存在，可以发布
          #   其它（403 限流 / 5xx）= 状态未知，本次跳过，留给下一次运行
          BASE_TAG="v${LATEST}${TAG_SUFFIX}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${BASE_TAG}")

          RELEASE_TAG="$BASE_TAG"
          if [ "$CODE" = "200" ]; then
            OWNER=$(gh release view "$BASE_TAG" --repo "${{ github.repository }}" --json name --jq '.name' 2>/dev/null || echo "")
            if [[ "$OWNER" == "$DOCKER_IMAGE "* ]]; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "✅ ${BASE_TAG} 已由本镜像发布，跳过。"
              exit 0
            fi
            # 只有名称形如 "<owner>/<repo> <版本>"（含斜杠+空格）才判定为“其它镜像占用”；
            # 历史遗留命名（如 "AdGuard Home 0.107.78"）无法归属，一律保守跳过，避免重复发布
            if [[ "$OWNER" != *"/"*" "* ]]; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "⏭️ ${BASE_TAG} 已存在且命名无法归属（$OWNER），保守跳过。"
              exit 0
            fi
            # 该标签已被其它镜像占用：退化到 <镜像名>-v<版本>，避免被永久漏发
            RELEASE_TAG="${IMAGE_SHORT}-v${LATEST}${TAG_SUFFIX}"
            CODE2=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")
            if [ "$CODE2" = "200" ]; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "✅ ${RELEASE_TAG} 已发布，跳过。"
              exit 0
            elif [ "$CODE2" != "404" ]; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "⏭️ 标签查询返回 ${CODE2}，本次跳过。"
              exit 0
            fi
            echo "⚠️ ${BASE_TAG} 已被其它镜像占用，本次改用 ${RELEASE_TAG} 发布。"
          elif [ "$CODE" != "404" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 仓库接口返回 ${CODE}（限流或异常），本次跳过，等待下次运行。"
            exit 0
          fi

          # 镜像就绪预检：tag 未上架 / 缺 linux/amd64 时安全跳过，等下一班再拉
          if docker buildx imagetools inspect "${DOCKER_IMAGE}:${IMAGE_TAG}" > "${RUNNER_TEMP}/img_inspect.txt" 2>/dev/null; then
            if grep -q "Platform:" "${RUNNER_TEMP}/img_inspect.txt" && ! grep -q "linux/amd64" "${RUNNER_TEMP}/img_inspect.txt"; then
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              echo "⏭️ 镜像 ${DOCKER_IMAGE}:${IMAGE_TAG} 无 linux/amd64 架构，跳过本次，等待下次运行。"
              exit 0
            fi
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 镜像 ${DOCKER_IMAGE}:${IMAGE_TAG} 尚未上架（tag 不存在），跳过本次，等待下次运行。"
            exit 0
          fi

          echo "has_new=true" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          UPSTREAM_BODY=$(echo "$RESP" | jq -r '.body')
          [ "$UPSTREAM_BODY" = "null" ] && UPSTREAM_BODY="*No release notes provided by upstream.*"
          echo "$UPSTREAM_BODY" > "${RUNNER_TEMP}/upstream_body.md"
          echo "🆕 新版本 ${LATEST}，发布标签 ${RELEASE_TAG}。"

      # 2. 仅在有新版时拉取并导出镜像（滚动 tag）
      - name: 拉取并导出 Docker 镜像
        if: steps.check_version.outputs.has_new == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.check_version.outputs.version }}"
          PULL_REF="${DOCKER_IMAGE}:${IMAGE_TAG}"
          docker pull "$PULL_REF"
          docker save "$PULL_REF" | gzip > "${IMAGE_SHORT}-${IMAGE_TAG}-${VERSION}.tar.gz"

      # 🔐 3. 计算导出包 SHA256
      - name: 计算镜像包 SHA256
        if: steps.check_version.outputs.has_new == 'true'
        id: file_sha
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          SHA=$(sha256sum "${IMAGE_SHORT}-${IMAGE_TAG}-${VERSION}.tar.gz" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      # 📝 4. 组装 Release 说明
      - name: 组装 Release 说明
        if: steps.check_version.outputs.has_new == 'true'
        run: |
          if [ -f "${RUNNER_TEMP}/upstream_body.md" ]; then
            echo "✅ 已找到缓存文件: ${RUNNER_TEMP}/upstream_body.md ($(wc -c < "${RUNNER_TEMP}/upstream_body.md") bytes)"
          else
            echo "⚠️ 警告: 缓存文件不存在: ${RUNNER_TEMP}/upstream_body.md"
          fi
          UPSTREAM_BODY=$(cat "${RUNNER_TEMP}/upstream_body.md")

          cat > release-body.md <<-'TEMPLATE_EOF'
          ## 📦 Docker Image Mirror (lite)
          TEMPLATE_EOF
          {
            echo "- **Version**: \`${{ steps.check_version.outputs.version }}\`"
            echo "- **Image**: \`${DOCKER_IMAGE}:${IMAGE_TAG}\`"
            echo "- **Tag**: \`${IMAGE_TAG}\` (滚动 tag，无 Nginx，配合外部反代使用)"
            echo "- **Source**: [Upstream Release](https://github.com/${UPSTREAM_REPO}/releases/tag/v${{ steps.check_version.outputs.version }})"
            echo ""
            echo "---"
            echo ""
            echo "${UPSTREAM_BODY}"
            echo ""
            echo "---"
            echo ""
            echo "### 🔐 校验信息"
            echo "- **包名**: \`${IMAGE_SHORT}-${IMAGE_TAG}-${{ steps.check_version.outputs.version }}.tar.gz\`"
            echo "- **SHA256**: \`${{ steps.file_sha.outputs.sha256 }}\`"
            echo ""
            echo "校验命令："
            echo "\`\`\`bash"
            echo "wget https://github.com/${{ github.repository }}/releases/download/${{ steps.check_version.outputs.release_tag }}/${IMAGE_SHORT}-${IMAGE_TAG}-${{ steps.check_version.outputs.version }}.tar.gz"
            echo "echo \"${{ steps.file_sha.outputs.sha256 }}  ${IMAGE_SHORT}-${IMAGE_TAG}-${{ steps.check_version.outputs.version }}.tar.gz\" | sha256sum -c"
            echo "\`\`\`"
          } >> release-body.md

      # 🚀 5. 创建 Release 并上传附件（独立 -lite tag）
      - name: 创建 Release 并上传附件
        if: steps.check_version.outputs.has_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check_version.outputs.release_tag }}
          name: "${{ env.DOCKER_IMAGE }} lite ${{ steps.check_version.outputs.version }}"
          body_path: release-body.md
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: "false"
          draft: false
          prerelease: false
          files: |
            *.tar.gz

      # 📋 6. 触发索引更新
      - name: 触发索引更新
        if: steps.check_version.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "update-index.yml" --repo "${{ github.repository }}"
